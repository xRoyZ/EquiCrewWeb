# Auto-generated by office-crew: the credential scan of this project's pipeline.
[extend]
useDefault = true
disabledRules = ["generic-api-key", "generic-credential-uri", "generic-password", "generic-username"]

[[allowlists]]
description = "published sample values"
regexTarget = "line"
regexes = ['''eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwi''']

[[allowlists]]
description = "published development values"
regexTarget = "secret"
regexes = ['''^Eby8vdM02xNOcqFlqUwJPLlm''']

[[allowlists]]
description = "masked values"
regexTarget = "secret"
regexes = ['''://[^:@/\s]*:\*+@''', '''hooks\.slack\.com/services/T0+/B0+/X+$''', '''^-----(?i:begin)[ A-Za-z0-9_-]{0,100}-----(?:[A-Za-z0-9+/]{0,39}[^A-Za-z0-9+/])*[A-Za-z0-9+/]{0,39}$''']

[[allowlists]]
description = "what a test brings along"
targetRules = ["private-key"]
paths = ['''(?i)(?:(?:^|/)(?:__fixtures__|__mocks__|__tests__|bench|benchmark|benchmarks|cypress|demo|demos|docs_src|e2e|example|examples|fixtures|integration|integration\-tests|integration_tests|playwright|profiling|sample|samples|spec|specs|t|test|testdata|testing|tests)/|((?:^|/)test_[^/]*\.py$|_test\.py$|_test\.go$|\.(test|spec|test-d)\.[cm]?[jt]sx?$|(?:^|/)conftest\.py$|(?:^|/)tests?\.py$|(?:^|/)(setup[-_.]?tests?|setup[-_.]jest|jest[-_.]setup|test[-_.]setup|setup[-_.]vitest|vitest[-_.]setup)\.[cm]?[jt]sx?$)|[^/]+\.(tests?|unittests?|integrationtests?|functionaltests?|acceptancetests?|specs?)/)''']

[[allowlists]]
description = "keys that are public by design"
targetRules = ["gcp-api-key"]
regexTarget = "line"
regexes = ['''(?i)\b(?:VITE_|NEXT_PUBLIC_|REACT_APP_|PUBLIC_|EXPO_PUBLIC_)\w*|firebase''']
